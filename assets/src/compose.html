<!doctype html>
<!-- Source des visuels. Ouvrir avec ?v=banner|social|promo|marquee|shot1|shot2 à la taille indiquée dans SIZES. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0f1012;
        --text: #f3efe8;
        --muted: #a29f99;
        --accent: #e8453c;
        --accent-2: #ff8a5c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      body {
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 90% at 78% 40%, rgba(232, 69, 60, 0.28), transparent 70%),
          radial-gradient(40% 70% at 95% 100%, rgba(45, 91, 255, 0.22), transparent 70%),
          radial-gradient(50% 60% at 0% 0%, rgba(255, 138, 92, 0.08), transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(70% 90% at 30% 50%, #000, transparent);
      }
      .copy {
        position: absolute;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.42em;
      }
      .brand img {
        width: 1.25em;
        height: 1.25em;
      }
      h1 {
        font-size: 1em;
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .tag {
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .tag em {
        font-style: normal;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        color: var(--muted);
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }
      .chips {
        display: flex;
        gap: 0.5em;
      }
      .chips span {
        padding: 0.32em 0.75em;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.04);
        color: #d9d5ce;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .shot {
        position: absolute;
        border-radius: 14px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 10px 30px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .shot img {
        display: block;
        width: 100%;
      }
      .caption {
        position: absolute;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .caption small {
        display: block;
        margin-top: 0.45em;
        color: var(--muted);
        font: 400 0.42em/1.45 system-ui, sans-serif;
        letter-spacing: 0;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: url(../screenshots/player.png) center / cover;
        filter: blur(18px) brightness(0.45) saturate(1.1);
        transform: scale(1.08);
      }

      /* --- Bannière README 1280×400 ------------------------------------------ */
      body.banner .copy {
        left: 72px;
        top: 0;
        bottom: 0;
        justify-content: center;
        gap: 18px;
        width: 560px;
      }
      body.banner .brand {
        font-size: 44px;
      }
      body.banner .tag {
        font-size: 30px;
      }
      body.banner .sub {
        font-size: 16.5px;
        max-width: 470px;
      }
      body.banner .chips {
        font-size: 13px;
        margin-top: 4px;
      }
      body.banner .player {
        left: 640px;
        top: 70px;
        width: 620px;
        transform: perspective(1400px) rotateY(-8deg) rotateX(2deg);
      }
      body.banner .popup {
        left: 610px;
        top: 150px;
        width: 300px;
        transform: perspective(1400px) rotateY(-8deg);
      }

      /* --- Aperçu social GitHub 1280×640 -------------------------------------- */
      body.social .copy {
        left: 80px;
        top: 0;
        bottom: 0;
        justify-content: center;
        gap: 22px;
        width: 500px;
      }
      body.social .brand {
        font-size: 52px;
      }
      body.social .tag {
        font-size: 36px;
      }
      body.social .sub {
        font-size: 19px;
        max-width: 470px;
      }
      body.social .chips {
        font-size: 15px;
        margin-top: 6px;
      }
      body.social .player {
        left: 660px;
        top: 120px;
        width: 700px;
        transform: perspective(1600px) rotateY(-10deg) rotateX(2deg);
      }
      body.social .popup {
        left: 600px;
        top: 300px;
        width: 340px;
        transform: perspective(1600px) rotateY(-10deg);
      }

      /* --- Petite vignette Chrome Web Store 440×280 --------------------------- */
      body.promo .copy {
        left: 28px;
        top: 30px;
        gap: 10px;
        width: 400px;
      }
      body.promo .brand {
        font-size: 25px;
      }
      body.promo .tag {
        font-size: 17px;
      }
      body.promo .popup {
        left: 150px;
        top: 112px;
        width: 270px;
        transform: perspective(900px) rotateY(-10deg);
      }
      body.promo .chips {
        font-size: 9.5px;
        margin-top: 4px;
      }

      /* --- Bandeau Chrome Web Store 1400×560 ---------------------------------- */
      body.marquee .copy {
        left: 90px;
        top: 0;
        bottom: 0;
        justify-content: center;
        gap: 22px;
        width: 560px;
      }
      body.marquee .brand {
        font-size: 56px;
      }
      body.marquee .tag {
        font-size: 38px;
      }
      body.marquee .sub {
        font-size: 19px;
        max-width: 520px;
      }
      body.marquee .chips {
        font-size: 15px;
      }
      body.marquee .player {
        left: 720px;
        top: 80px;
        width: 720px;
        transform: perspective(1600px) rotateY(-9deg) rotateX(2deg);
      }
      body.marquee .popup {
        left: 680px;
        top: 220px;
        width: 340px;
        transform: perspective(1600px) rotateY(-9deg);
      }

      /* --- Captures Chrome Web Store 1280×800 --------------------------------- */
      body.shot1 .caption,
      body.shot2 .caption {
        left: 80px;
        top: 72px;
        font-size: 44px;
        width: 520px;
      }
      body.shot1 .popup {
        right: 110px;
        top: 160px;
        width: 520px;
      }
      body.shot1 .caption {
        top: 250px;
      }
      body.shot2 .caption {
        left: 0;
        right: 0;
        top: 50px;
        width: auto;
        text-align: center;
        font-size: 40px;
      }
      body.shot2 .caption small {
        font-size: 0.45em;
      }
      body.shot2 .player {
        left: 110px;
        top: 200px;
        width: 1060px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <script>
      const SIZES = {
        banner: [1280, 400],
        social: [1280, 640],
        promo: [440, 280],
        marquee: [1400, 560],
        shot1: [1280, 800],
        shot2: [1280, 800],
      };
      const v = new URLSearchParams(location.search).get('v') || 'banner';
      const [w, h] = SIZES[v];
      document.documentElement.style.setProperty('--w', `${w}px`);
      document.documentElement.style.setProperty('--h', `${h}px`);
      document.body.className = v;

      const brand = `<div class="brand"><img src="../logo.svg" alt=""><h1>Sources vidéo</h1></div>`;
      const chips = `<div class="chips"><span>HLS</span><span>MP4</span><span>WebM</span><span>DASH</span></div>`;
      const shot = (cls, src) => `<div class="shot ${cls}"><img src="../screenshots/${src}" alt=""></div>`;
      const html = {
        banner: `<div class="copy">${brand}<p class="tag">Toutes les vidéos d'une page,<br><em>en un clic.</em></p>
          <p class="sub">Aperçu, durée et lien direct de chaque vidéo, et un lecteur complet pour la regarder.</p>${chips}</div>
          ${shot('player', 'player.png')}${shot('popup', 'popup.png')}`,
        social: `<div class="copy">${brand}<p class="tag">Toutes les vidéos d'une page, <em>en un clic.</em></p>
          <p class="sub">Aperçu, durée et lien direct de chaque vidéo, et un lecteur complet pour la regarder.</p>${chips}</div>
          ${shot('player', 'player.png')}${shot('popup', 'popup.png')}`,
        promo: `<div class="copy">${brand}<p class="tag">Toutes les vidéos d'une page, <em>en un clic.</em></p></div>${shot('popup', 'popup.png')}`,
        marquee: `<div class="copy">${brand}<p class="tag">Toutes les vidéos d'une page,<br><em>en un clic.</em></p>
          <p class="sub">Aperçu, durée et lien direct de chaque vidéo, et un lecteur complet pour la regarder.</p>${chips}</div>
          ${shot('player', 'player.png')}${shot('popup', 'popup.png')}`,
        shot1: `<div class="backdrop"></div><p class="caption">Toutes les vidéos de la page, avec aperçu et durée.
          <small>Flux HLS, fichiers MP4 et WebM, liens trouvés dans le code : copiez le lien, téléchargez, ou ouvrez dans le lecteur.</small></p>
          ${shot('popup', 'popup.png')}`,
        shot2: `<p class="caption">Un lecteur complet, rien qu'à vous.
          <small>Aperçu au survol, qualité, vitesse, sous-titres, capture, image dans l'image, reprise de lecture, raccourcis clavier.</small></p>
          ${shot('player', 'player-quality.png')}`,
      }[v];
      document.body.insertAdjacentHTML('beforeend', html);
    </script>
  </body>
</html>
